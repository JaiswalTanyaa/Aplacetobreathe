<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Post-Session Feedback - A Place to Breathe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#6f3800",
                        "secondary-container": "#ecdcfd",
                        "surface-container-highest": "#e4e2de",
                        "primary-container": "#8ba88e",
                        "on-secondary-fixed": "#21172e",
                        "on-secondary-container": "#6b5f7b",
                        "inverse-primary": "#b0ceb2",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#4a654e",
                        "surface-container-high": "#eae8e4",
                        "on-primary-fixed-variant": "#334d38",
                        "outline": "#737972",
                        "on-error": "#ffffff",
                        "on-surface": "#1b1c1a",
                        "secondary-fixed": "#ecdcfd",
                        "primary-fixed-dim": "#b0ceb2",
                        "primary-fixed": "#cceace",
                        "on-background": "#1b1c1a",
                        "primary": "#4a654e",
                        "surface": "#fbf9f5",
                        "on-secondary-fixed-variant": "#4d425c",
                        "tertiary-fixed-dim": "#ffb780",
                        "surface-container-low": "#f5f3ef",
                        "surface-variant": "#e4e2de",
                        "on-surface-variant": "#424842",
                        "tertiary": "#8e4e14",
                        "background": "#fbf9f5",
                        "surface-dim": "#dbdad6",
                        "on-primary-container": "#233d29",
                        "inverse-on-surface": "#f2f0ed",
                        "on-tertiary-container": "#592c00",
                        "tertiary-fixed": "#ffdcc4",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#07200f",
                        "secondary-fixed-dim": "#d0c1e0",
                        "surface-container": "#efeeea",
                        "secondary": "#655974",
                        "on-tertiary-fixed": "#2f1400",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c2c8c0",
                        "surface-bright": "#fbf9f5",
                        "inverse-surface": "#30312e",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#dd8f50"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1120px",
                        "section-padding-mobile": "40px",
                        "section-padding-desktop": "80px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Nunito Sans"],
                        "headline-xl": ["Nunito Sans"],
                        "crisis-link": ["Nunito Sans"],
                        "body-lg": ["Work Sans"],
                        "headline-lg": ["Nunito Sans"],
                        "label-md": ["Work Sans"],
                        "headline-xl-mobile": ["Nunito Sans"],
                        "body-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "crisis-link": ["16px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .blob-bg {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 30% 30%, rgba(236, 220, 253, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(176, 206, 178, 0.3) 0%, transparent 40%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
        }
        .rating-emoji {
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: grayscale(100%) opacity(50%);
        }
        .rating-emoji:hover {
            transform: scale(1.1);
            filter: grayscale(0%) opacity(80%);
        }
        .rating-emoji.selected {
            transform: scale(1.15);
            filter: grayscale(0%) opacity(100%);
        }
        .rating-container:hover .rating-emoji:not(:hover) {
             filter: grayscale(100%) opacity(30%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen relative overflow-hidden flex flex-col">
<div class="blob-bg"></div>
<main class="flex-grow flex items-center justify-center p-gutter relative z-10 my-section-padding-mobile md:my-section-padding-desktop">
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl p-8 md:p-12 max-w-2xl w-full shadow-[0_20px_40px_rgba(139,168,142,0.05)] border border-surface-variant relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/20 rounded-full blur-2xl -mr-16 -mt-16 pointer-events-none"></div>
<div class="text-center mb-10">
<span class="material-symbols-outlined text-primary text-5xl mb-4 block" data-icon="psychiatry" style="font-variation-settings: 'FILL' 1;">psychiatry</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">How was your session with Dr. Julian?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your feedback helps us create a better, safer space for you.</p>
</div>
<form action="#" class="space-y-10" method="POST">
<div class="space-y-4">
<label class="font-label-md text-label-md text-on-surface-variant block text-center uppercase tracking-wider">How are you feeling?</label>
<div class="flex justify-between items-center rating-container px-2 md:px-8">
<label class="flex flex-col items-center gap-2 cursor-pointer group">
<input class="sr-only peer" name="rating" type="radio" value="1">
<div class="text-4xl md:text-5xl rating-emoji peer-checked:selected peer-focus-visible:ring-2 ring-primary rounded-full" role="button" tabindex="0">☁️</div>
<span class="font-body-md text-body-md text-sm text-on-surface-variant/60 peer-checked:text-on-surface font-medium transition-colors">Not great</span>
</label>
<label class="flex flex-col items-center gap-2 cursor-pointer group">
<input class="sr-only peer" name="rating" type="radio" value="2">
<div class="text-4xl md:text-5xl rating-emoji peer-checked:selected peer-focus-visible:ring-2 ring-primary rounded-full" role="button" tabindex="0">🌧️</div>
<span class="font-body-md text-body-md text-sm text-on-surface-variant/60 peer-checked:text-on-surface font-medium transition-colors">Okay</span>
</label>
<label class="flex flex-col items-center gap-2 cursor-pointer group">
<input class="sr-only peer" name="rating" type="radio" value="3">
<div class="text-4xl md:text-5xl rating-emoji peer-checked:selected peer-focus-visible:ring-2 ring-primary rounded-full" role="button" tabindex="0">🌤️</div>
<span class="font-body-md text-body-md text-sm text-on-surface-variant/60 peer-checked:text-on-surface font-medium transition-colors">Good</span>
</label>
<label class="flex flex-col items-center gap-2 cursor-pointer group">
<input checked="" class="sr-only peer" name="rating" type="radio" value="4">
<div class="text-4xl md:text-5xl rating-emoji selected peer-checked:selected peer-focus-visible:ring-2 ring-tertiary-container rounded-full relative" role="button" tabindex="0">
                                ☀️
                                <div class="absolute inset-0 bg-tertiary-container/20 rounded-full blur-md -z-10 scale-150"></div>
</div>
<span class="font-body-md text-body-md text-sm text-tertiary font-semibold transition-colors">Great</span>
</label>
<label class="flex flex-col items-center gap-2 cursor-pointer group">
<input class="sr-only peer" name="rating" type="radio" value="5">
<div class="text-4xl md:text-5xl rating-emoji peer-checked:selected peer-focus-visible:ring-2 ring-primary rounded-full" role="button" tabindex="0">🌈</div>
<span class="font-body-md text-body-md text-sm text-on-surface-variant/60 peer-checked:text-on-surface font-medium transition-colors">Amazing</span>
</label>
</div>
</div>
<div class="space-y-3">
<label class="font-label-md text-label-md text-on-surface block" for="feedback_text">Anything else you'd like to share? (Optional)</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all shadow-inner" id="feedback_text" name="feedback_text" placeholder="Take your time, this is a safe space..." rows="4"></textarea>
</div>
<div class="flex items-center gap-3">
<div class="relative flex items-start">
<div class="flex h-6 items-center">
<input class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="anonymous" name="anonymous" type="checkbox">
</div>
<div class="ml-3 text-sm leading-6">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="anonymous">Make this feedback anonymous</label>
</div>
</div>
</div>
<div class="pt-4 flex flex-col sm:flex-row gap-4 items-center justify-between">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors px-6 py-3 rounded-full hover:bg-surface-variant/50" type="button">
                        Skip for now
                    </button>
<button class="w-full sm:w-auto bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-full hover:bg-primary-container hover:text-on-primary-container transition-all shadow-[0_4px_12px_rgba(74,101,78,0.2)] hover:shadow-[0_6px_16px_rgba(74,101,78,0.3)] active:scale-95" type="submit">
                        Submit Feedback
                    </button>
</div>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const emojis = document.querySelectorAll('.rating-emoji');
            const radios = document.querySelectorAll('input[name="rating"]');

            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    emojis.forEach(emoji => emoji.classList.remove('selected'));
                    
                    const label = e.target.closest('label');
                    const selectedEmoji = label.querySelector('.rating-emoji');
                    selectedEmoji.classList.add('selected');
                });
            });

            // Keyboard accessibility for rating emojis
            emojis.forEach(emoji => {
                emoji.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const radio = emoji.closest('label').querySelector('input');
                        radio.checked = true;
                        radio.dispatchEvent(new Event('change'));
                    }
                });
            });
        });
    </script>
</body></html>
